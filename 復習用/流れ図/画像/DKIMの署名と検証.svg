<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1382" viewBox="0 0 800 1382" role="img" aria-labelledby="title desc">
<title id="title">DKIMの署名と検証の全体像</title>
<desc id="desc">送信メールサーバが署名し、受信メールサーバが検証する。 本文ハッシュがbh=、署名がb=。秘密鍵はDNSにもメールにも載せない。 署名して配送。内部。送信メールサーバ。本文を正規化してbh=を作り、対象ヘッダ等へDKIM秘密鍵で署名する。 署名して配送。送信。送信メールサーバから受信メールサーバ。本文・ヘッダ・DKIM-SignatureをSMTPで配送する。 受信側の検証。交換。受信メールサーバとDNS。d=とs=から公開鍵の場所を決め、TXTレコードを取得する。 受信側の検証。確認。受信メールサーバ。受信本文を同じ方式で正規化・ハッシュ化し、bh=と照合する。 受信側の検証。確認。受信メールサーバ。対象ヘッダ等とDNSの公開鍵を使い、署名b=を検証する。 結果の利用。内部。受信メールサーバ。DKIM結果を記録する。DMARCではFromとのalignment等も別途評価する。</desc>
<rect width="800" height="1382" fill="#f3f6fa"/>
<g font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="32" y="34" font-size="16" font-weight="600" fill="#52657b">全体像  /  段階ごとに、上から読む</text>
<text x="32" y="74" font-size="28" font-weight="700" fill="#172e46">DKIMの署名と検証</text>
<rect x="32" y="103" width="736" height="58" rx="12" fill="#e6eff8"/>
<text x="50" y="132" font-size="21" font-weight="600" fill="#172e46">送信メールサーバが署名し、受信メールサーバが検証する。</text>
<text x="32" y="189" font-size="15" font-weight="400" fill="#52657b">矢印：情報の受渡し　｜　内部・確認：通信なし　｜　並行：担当を分けて調整</text>
<rect x="72" y="215" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="244" font-size="20" font-weight="700" fill="#172e46">署名して配送</text>
<rect x="72" y="276" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="299" r="18" fill="#203b59"/>
<text x="30" y="305" font-size="19" font-weight="600" fill="#ffffff">1</text>
<path d="M36 320V420" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="288" width="502" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="313" font-size="19" font-weight="600" fill="#075985">送信メールサーバ</text>
<text x="632" y="315" font-size="17" font-weight="600" fill="#52657b">内部処理</text>
<text x="94" y="356" font-size="22" font-weight="400" fill="#172e46">本文を正規化してbh=を作り、対象ヘッダ等へDKIM秘密鍵で署</text>
<text x="94" y="388" font-size="22" font-weight="400" fill="#172e46">名する。</text>
<rect x="72" y="426" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="449" r="18" fill="#203b59"/>
<text x="30" y="455" font-size="19" font-weight="600" fill="#ffffff">2</text>
<rect x="88" y="438" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="463" font-size="19" font-weight="600" fill="#075985">送信メールサーバ</text>
<rect x="446" y="438" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="463" font-size="19" font-weight="600" fill="#5b21b6">受信メールサーバ</text>
<path d="M402 458H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="506" font-size="22" font-weight="400" fill="#172e46">本文・ヘッダ・DKIM-SignatureをSMTPで配送する。</text>
<rect x="72" y="558" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="587" font-size="20" font-weight="700" fill="#172e46">受信側の検証</text>
<rect x="72" y="619" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="642" r="18" fill="#203b59"/>
<text x="30" y="648" font-size="19" font-weight="600" fill="#ffffff">3</text>
<path d="M36 663V731" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="631" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="656" font-size="19" font-weight="600" fill="#5b21b6">受信メールサーバ</text>
<rect x="446" y="631" width="306" height="40" rx="8" fill="#dcfce7"/>
<text x="460" y="656" font-size="19" font-weight="600" fill="#166534">DNS</text>
<path d="M402 651H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M402 651l7 -6m-7 6l7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="699" font-size="22" font-weight="400" fill="#172e46">d=とs=から公開鍵の場所を決め、TXTレコードを取得する。</text>
<rect x="72" y="737" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="760" r="18" fill="#203b59"/>
<text x="30" y="766" font-size="19" font-weight="600" fill="#ffffff">4</text>
<path d="M36 781V881" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="749" width="502" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="774" font-size="19" font-weight="600" fill="#5b21b6">受信メールサーバ</text>
<text x="632" y="776" font-size="17" font-weight="600" fill="#52657b">確認・判断</text>
<text x="94" y="817" font-size="22" font-weight="400" fill="#172e46">受信本文を同じ方式で正規化・ハッシュ化し、bh=と照合する</text>
<text x="94" y="849" font-size="22" font-weight="400" fill="#172e46">。</text>
<rect x="72" y="887" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="910" r="18" fill="#203b59"/>
<text x="30" y="916" font-size="19" font-weight="600" fill="#ffffff">5</text>
<rect x="88" y="899" width="502" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="924" font-size="19" font-weight="600" fill="#5b21b6">受信メールサーバ</text>
<text x="632" y="926" font-size="17" font-weight="600" fill="#52657b">確認・判断</text>
<text x="94" y="967" font-size="22" font-weight="400" fill="#172e46">対象ヘッダ等とDNSの公開鍵を使い、署名b=を検証する。</text>
<rect x="72" y="1019" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="1048" font-size="20" font-weight="700" fill="#172e46">結果の利用</text>
<rect x="72" y="1080" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="1103" r="18" fill="#203b59"/>
<text x="30" y="1109" font-size="19" font-weight="600" fill="#ffffff">6</text>
<rect x="88" y="1092" width="502" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="1117" font-size="19" font-weight="600" fill="#5b21b6">受信メールサーバ</text>
<text x="632" y="1119" font-size="17" font-weight="600" fill="#52657b">内部処理</text>
<text x="94" y="1160" font-size="22" font-weight="400" fill="#172e46">DKIM結果を記録する。DMARCではFromとのalignment等も別途</text>
<text x="94" y="1192" font-size="22" font-weight="400" fill="#172e46">評価する。</text>
<rect x="32" y="1244" width="736" height="110" rx="12" fill="#fff1d7"/>
<text x="48" y="1271" font-size="17" font-weight="700" fill="#764a0b">前提・読み違えないポイント</text>
<text x="48" y="1301" font-size="19" font-weight="400" fill="#764a0b">本文ハッシュがbh=、署名がb=。秘密鍵はDNSにもメールにも載せない</text>
<text x="48" y="1329" font-size="19" font-weight="400" fill="#764a0b">。</text>
</g>
