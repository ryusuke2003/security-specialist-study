<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1414" viewBox="0 0 800 1414" role="img" aria-labelledby="title desc">
<title id="title">SAMLによるSSOの全体像</title>
<desc id="desc">IdPが利用者を認証。SPがAssertionを検証。 SP起点のRedirect／POSTの例。利用者のパスワードやIdP用CookieをSPへ渡さない。 IdPで認証。送信。勤怠SaaS（SP）からブラウザ。AuthnRequest付きで会社IdPへのリダイレクトを返す。 IdPで認証。交換。ブラウザと会社のIdP。認証要求を送る。既存ログインを利用するか、利用者のログイン操作を仲介する。 認証結果をSPへ。送信。会社のIdPからブラウザ。認証成功後、署名したAssertionを含むSAML Responseを返す。 認証結果をSPへ。送信。ブラウザから勤怠SaaS（SP）。SPのACSへSAML ResponseをPOSTする。 SPでログイン。確認。勤怠SaaS（SP）。IdPの署名、宛先・Audience・期限・要求ID・再利用等を検証する。 SPでログイン。送信。勤怠SaaS（SP）からブラウザ。検証と権限確認の成功後、SP専用のセッションCookieを返す。</desc>
<rect width="800" height="1414" fill="#f3f6fa"/>
<g font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="32" y="34" font-size="16" font-weight="600" fill="#52657b">全体像  /  段階ごとに、上から読む</text>
<text x="32" y="74" font-size="28" font-weight="700" fill="#172e46">SAMLによるSSO</text>
<rect x="32" y="103" width="736" height="58" rx="12" fill="#e6eff8"/>
<text x="50" y="132" font-size="21" font-weight="600" fill="#172e46">IdPが利用者を認証。SPがAssertionを検証。</text>
<text x="32" y="189" font-size="15" font-weight="400" fill="#52657b">矢印：情報の受渡し　｜　内部・確認：通信なし　｜　並行：担当を分けて調整</text>
<rect x="72" y="215" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="244" font-size="20" font-weight="700" fill="#172e46">IdPで認証</text>
<rect x="72" y="276" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="299" r="18" fill="#203b59"/>
<text x="30" y="305" font-size="19" font-weight="600" fill="#ffffff">1</text>
<path d="M36 320V388" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="288" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="313" font-size="19" font-weight="600" fill="#075985">勤怠SaaS（SP）</text>
<rect x="446" y="288" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="313" font-size="19" font-weight="600" fill="#5b21b6">ブラウザ</text>
<path d="M402 308H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="356" font-size="22" font-weight="400" fill="#172e46">AuthnRequest付きで会社IdPへのリダイレクトを返す。</text>
<rect x="72" y="394" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="417" r="18" fill="#203b59"/>
<text x="30" y="423" font-size="19" font-weight="600" fill="#ffffff">2</text>
<rect x="88" y="406" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="431" font-size="19" font-weight="600" fill="#5b21b6">ブラウザ</text>
<rect x="446" y="406" width="306" height="40" rx="8" fill="#dcfce7"/>
<text x="460" y="431" font-size="19" font-weight="600" fill="#166534">会社のIdP</text>
<path d="M402 426H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M402 426l7 -6m-7 6l7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="474" font-size="22" font-weight="400" fill="#172e46">認証要求を送る。既存ログインを利用するか、利用者のログ</text>
<text x="94" y="506" font-size="22" font-weight="400" fill="#172e46">イン操作を仲介する。</text>
<rect x="72" y="558" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="587" font-size="20" font-weight="700" fill="#172e46">認証結果をSPへ</text>
<rect x="72" y="619" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="642" r="18" fill="#203b59"/>
<text x="30" y="648" font-size="19" font-weight="600" fill="#ffffff">3</text>
<path d="M36 663V763" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="631" width="306" height="40" rx="8" fill="#dcfce7"/>
<text x="102" y="656" font-size="19" font-weight="600" fill="#166534">会社のIdP</text>
<rect x="446" y="631" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="656" font-size="19" font-weight="600" fill="#5b21b6">ブラウザ</text>
<path d="M402 651H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="699" font-size="22" font-weight="400" fill="#172e46">認証成功後、署名したAssertionを含むSAML Responseを返す</text>
<text x="94" y="731" font-size="22" font-weight="400" fill="#172e46">。</text>
<rect x="72" y="769" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="792" r="18" fill="#203b59"/>
<text x="30" y="798" font-size="19" font-weight="600" fill="#ffffff">4</text>
<rect x="88" y="781" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="806" font-size="19" font-weight="600" fill="#5b21b6">ブラウザ</text>
<rect x="446" y="781" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="460" y="806" font-size="19" font-weight="600" fill="#075985">勤怠SaaS（SP）</text>
<path d="M402 801H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="849" font-size="22" font-weight="400" fill="#172e46">SPのACSへSAML ResponseをPOSTする。</text>
<rect x="72" y="901" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="930" font-size="20" font-weight="700" fill="#172e46">SPでログイン</text>
<rect x="72" y="962" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="985" r="18" fill="#203b59"/>
<text x="30" y="991" font-size="19" font-weight="600" fill="#ffffff">5</text>
<path d="M36 1006V1106" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="974" width="502" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="999" font-size="19" font-weight="600" fill="#075985">勤怠SaaS（SP）</text>
<text x="632" y="1001" font-size="17" font-weight="600" fill="#52657b">確認・判断</text>
<text x="94" y="1042" font-size="22" font-weight="400" fill="#172e46">IdPの署名、宛先・Audience・期限・要求ID・再利用等を検証</text>
<text x="94" y="1074" font-size="22" font-weight="400" fill="#172e46">する。</text>
<rect x="72" y="1112" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="1135" r="18" fill="#203b59"/>
<text x="30" y="1141" font-size="19" font-weight="600" fill="#ffffff">6</text>
<rect x="88" y="1124" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="1149" font-size="19" font-weight="600" fill="#075985">勤怠SaaS（SP）</text>
<rect x="446" y="1124" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="1149" font-size="19" font-weight="600" fill="#5b21b6">ブラウザ</text>
<path d="M402 1144H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="1192" font-size="22" font-weight="400" fill="#172e46">検証と権限確認の成功後、SP専用のセッションCookieを返す</text>
<text x="94" y="1224" font-size="22" font-weight="400" fill="#172e46">。</text>
<rect x="32" y="1276" width="736" height="110" rx="12" fill="#fff1d7"/>
<text x="48" y="1303" font-size="17" font-weight="700" fill="#764a0b">前提・読み違えないポイント</text>
<text x="48" y="1333" font-size="19" font-weight="400" fill="#764a0b">SP起点のRedirect／POSTの例。利用者のパスワードやIdP用Cookieを</text>
<text x="48" y="1361" font-size="19" font-weight="400" fill="#764a0b">SPへ渡さない。</text>
</g>
</svg>
