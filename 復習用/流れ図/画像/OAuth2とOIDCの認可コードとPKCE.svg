<text x="102" y="313" font-size="19" font-weight="600" fill="#075985">Webアプリのサーバ</text>
<text x="632" y="315" font-size="17" font-weight="600" fill="#52657b">内部処理</text>
<text x="94" y="356" font-size="22" font-weight="400" fill="#172e46">verifier・state・nonceを保持し、verifierからchallengeを</text>
<text x="94" y="388" font-size="22" font-weight="400" fill="#172e46">作る。</text>
