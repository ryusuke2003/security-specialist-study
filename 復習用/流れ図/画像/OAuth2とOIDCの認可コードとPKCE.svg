<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1746" viewBox="0 0 800 1746" role="img" aria-labelledby="title desc">
<title id="title">OAuth 2.0 / OIDCの認可コードとPKCEの全体像</title>
<desc id="desc">認可コードはブラウザ経由。トークン交換はサーバー間。 サーバーサイドWebアプリの例。PKCEは認可サーバ、IDトークンはWebアプリが検証。 認可要求とコード。内部。Webアプリのサーバ。verifier・state・nonceを保持し、verifierからchallengeを作る。 認可要求とコード。送信。Webアプリのサーバからブラウザ。challenge・state・nonce等を含む認可サーバへのリダイレクトを返す。 認可要求とコード。交換。ブラウザと認可・認証サーバ。利用者のログイン・同意を仲介し、成功後の認可コードとstateを受け取る。 認可要求とコード。送信。ブラウザからWebアプリのサーバ。callbackへ認可コードとstateを届ける。Webアプリがstateを照合する。 トークン交換。送信。Webアプリのサーバから認可・認証サーバ。認可コード・verifier等を送る。認可サーバがコードとPKCE等を検証する。 トークン交換。送信。認可・認証サーバからWebアプリのサーバ。検証成功時にアクセストークンとIDトークンを返す。 ログインとAPI利用。確認。Webアプリのサーバ。IDトークンの署名・iss・aud・exp・nonce等を検証し、ログインを成立させる。 ログインとAPI利用。送信。WebアプリのサーバからAPIサーバ。アクセストークンでAPIを要求する。API側が有効性と権限を検証する。</desc>
<rect width="800" height="1746" fill="#f3f6fa"/>
<g font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="32" y="34" font-size="16" font-weight="600" fill="#52657b">全体像  /  段階ごとに、上から読む</text>
<text x="32" y="74" font-size="28" font-weight="700" fill="#172e46">OAuth 2.0 / OIDCの認可コードとPKCE</text>
<rect x="32" y="103" width="736" height="58" rx="12" fill="#e6eff8"/>
<text x="50" y="132" font-size="21" font-weight="600" fill="#172e46">認可コードはブラウザ経由。トークン交換はサーバー間。</text>
<text x="32" y="189" font-size="15" font-weight="400" fill="#52657b">矢印：情報の受渡し　｜　内部・確認：通信なし　｜　並行：担当を分けて調整</text>
