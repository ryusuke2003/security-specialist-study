<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1393" viewBox="0 0 800 1393" role="img" aria-labelledby="title desc">
<title id="title">IPsecトンネルモードとIKEの全体像</title>
<desc id="desc">IKEは通信の準備。ESPは実データの保護。 拠点間VPNの例。相互認証が成功してからESPを使い、検証失敗時は転送しない。 準備：IKEv2。交換。VPNゲートウェイAとVPNゲートウェイB。IKE_SA_INITで方式・DH公開値・nonceを交換する。 準備：IKEv2。内部。両VPNゲートウェイ。各自のDH秘密値と相手の公開値等からIKE用の鍵を導出する。 準備：IKEv2。交換。VPNゲートウェイAとVPNゲートウェイB。保護したIKE_AUTHで相互認証し、方向別ESP SA・鍵・通信範囲を確立する。 実データ：ESP。送信。端末AからVPNゲートウェイA。端末B宛ての元IPパケットを送る。 実データ：ESP。送信。VPNゲートウェイAからVPNゲートウェイB。元IPパケット全体をESPで保護し、GW宛ての外側IPヘッダで運ぶ。 実データ：ESP。確認。VPNゲートウェイB。SPIでSAを選び、再送・完全性・復号結果を確認する。 実データ：ESP。送信。VPNゲートウェイBから端末B。検証成功時だけ、復元した元IPパケットを転送する。</desc>
<rect width="800" height="1393" fill="#f3f6fa"/>
<g font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="32" y="34" font-size="16" font-weight="600" fill="#52657b">全体像  /  段階ごとに、上から読む</text>
<text x="32" y="74" font-size="28" font-weight="700" fill="#172e46">IPsecトンネルモードとIKE</text>
<rect x="32" y="103" width="736" height="58" rx="12" fill="#e6eff8"/>
<text x="50" y="132" font-size="21" font-weight="600" fill="#172e46">IKEは通信の準備。ESPは実データの保護。</text>
<text x="32" y="189" font-size="15" font-weight="400" fill="#52657b">矢印：情報の受渡し　｜　内部・確認：通信なし　｜　並行：担当を分けて調整</text>
<rect x="72" y="215" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="244" font-size="20" font-weight="700" fill="#172e46">準備：IKEv2</text>
<rect x="72" y="276" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="299" r="18" fill="#203b59"/>
<text x="30" y="305" font-size="19" font-weight="600" fill="#ffffff">1</text>
<path d="M36 320V388" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="288" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="313" font-size="19" font-weight="600" fill="#075985">VPNゲートウェイA</text>
<rect x="446" y="288" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="313" font-size="19" font-weight="600" fill="#5b21b6">VPNゲートウェイB</text>
<path d="M402 308H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M402 308l7 -6m-7 6l7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="356" font-size="22" font-weight="400" fill="#172e46">IKE_SA_INITで方式・DH公開値・nonceを交換する。</text>
<rect x="72" y="394" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="417" r="18" fill="#203b59"/>
<text x="30" y="423" font-size="19" font-weight="600" fill="#ffffff">2</text>
<path d="M36 438V506" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="406" width="502" height="40" rx="8" fill="#dcfce7"/>
<text x="102" y="431" font-size="19" font-weight="600" fill="#166534">両VPNゲートウェイ</text>
<text x="632" y="433" font-size="17" font-weight="600" fill="#52657b">内部処理</text>
<text x="94" y="474" font-size="22" font-weight="400" fill="#172e46">各自のDH秘密値と相手の公開値等からIKE用の鍵を導出する。</text>
<rect x="72" y="512" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="535" r="18" fill="#203b59"/>
<text x="30" y="541" font-size="19" font-weight="600" fill="#ffffff">3</text>
<rect x="88" y="524" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="549" font-size="19" font-weight="600" fill="#075985">VPNゲートウェイA</text>
<rect x="446" y="524" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="549" font-size="19" font-weight="600" fill="#5b21b6">VPNゲートウェイB</text>
<path d="M402 544H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M402 544l7 -6m-7 6l7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="592" font-size="22" font-weight="400" fill="#172e46">保護したIKE_AUTHで相互認証し、方向別ESP SA・鍵・通信範</text>
<text x="94" y="624" font-size="22" font-weight="400" fill="#172e46">囲を確立する。</text>
<rect x="72" y="676" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="705" font-size="20" font-weight="700" fill="#172e46">実データ：ESP</text>
<rect x="72" y="737" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="760" r="18" fill="#203b59"/>
<text x="30" y="766" font-size="19" font-weight="600" fill="#ffffff">4</text>
<path d="M36 781V849" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="749" width="306" height="40" rx="8" fill="#fef3c7"/>
<text x="102" y="774" font-size="19" font-weight="600" fill="#92400e">端末A</text>
<rect x="446" y="749" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="460" y="774" font-size="19" font-weight="600" fill="#075985">VPNゲートウェイA</text>
<path d="M402 769H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="817" font-size="22" font-weight="400" fill="#172e46">端末B宛ての元IPパケットを送る。</text>
<rect x="72" y="855" width="696" height="136" rx="12" fill="#ffffff"/>
<circle cx="36" cy="878" r="18" fill="#203b59"/>
<text x="30" y="884" font-size="19" font-weight="600" fill="#ffffff">5</text>
<path d="M36 899V999" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="867" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="102" y="892" font-size="19" font-weight="600" fill="#075985">VPNゲートウェイA</text>
<rect x="446" y="867" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="892" font-size="19" font-weight="600" fill="#5b21b6">VPNゲートウェイB</text>
<path d="M402 887H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="935" font-size="22" font-weight="400" fill="#172e46">元IPパケット全体をESPで保護し、GW宛ての外側IPヘッダで運</text>
<text x="94" y="967" font-size="22" font-weight="400" fill="#172e46">ぶ。</text>
<rect x="72" y="1005" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="1028" r="18" fill="#203b59"/>
<text x="30" y="1034" font-size="19" font-weight="600" fill="#ffffff">6</text>
<path d="M36 1049V1117" stroke="#bac9d8" stroke-width="2"/>
<rect x="88" y="1017" width="502" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="1042" font-size="19" font-weight="600" fill="#5b21b6">VPNゲートウェイB</text>
<text x="632" y="1044" font-size="17" font-weight="600" fill="#52657b">確認・判断</text>
<text x="94" y="1085" font-size="22" font-weight="400" fill="#172e46">SPIでSAを選び、再送・完全性・復号結果を確認する。</text>
<rect x="72" y="1123" width="696" height="104" rx="12" fill="#ffffff"/>
<circle cx="36" cy="1146" r="18" fill="#203b59"/>
<text x="30" y="1152" font-size="19" font-weight="600" fill="#ffffff">7</text>
<rect x="88" y="1135" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="102" y="1160" font-size="19" font-weight="600" fill="#5b21b6">VPNゲートウェイB</text>
<rect x="446" y="1135" width="306" height="40" rx="8" fill="#e0f2fe"/>
<text x="460" y="1160" font-size="19" font-weight="600" fill="#075985">端末B</text>
<path d="M402 1155H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="1203" font-size="22" font-weight="400" fill="#172e46">検証成功時だけ、復元した元IPパケットを転送する。</text>
<rect x="32" y="1255" width="736" height="110" rx="12" fill="#fff1d7"/>
<text x="48" y="1282" font-size="17" font-weight="700" fill="#764a0b">前提・読み違えないポイント</text>
<text x="48" y="1312" font-size="19" font-weight="400" fill="#764a0b">拠点間VPNの例。相互認証が成功してからESPを使い、検証失敗時は転</text>
<text x="48" y="1340" font-size="19" font-weight="400" fill="#764a0b">送しない。</text>
</g>
</svg>
