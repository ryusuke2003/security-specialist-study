<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1532" viewBox="0 0 800 1532" role="img" aria-labelledby="title desc">
<title id="title">EDRテレメトリの収集・分析・対応の全体像</title>
<desc id="desc">観測データは基盤へ。対応指示は端末へ。 基盤側で分析し、人が対応を承認する例。コマンド送信と隔離成功は別。 収集・分析。送信。端末OSからEDRエージェント。プロセス起動・ファイル変更・通信イベント等を通知する。 収集・分析。送信。EDRエージェントからEDR分析基盤。端末ID・時刻等を付けたテレメトリを、保護された経路で送る。 収集・分析。送信。EDR分析基盤からSOC担当者。受信データを保存・分析し、不審な挙動と検知根拠を表示する。 対応指示。送信。SOC担当者からEDR分析基盤。対象端末と、隔離・プロセス停止等の操作を指定する。 対応指示。送信。EDR分析基盤からEDRエージェント。操作者の権限を確認したうえで、対象端末にコマンドを送る。 実行・結果確認。交換。EDRエージェントと端末OS。通信制限等の操作を要求し、実行結果を確認する。 実行・結果確認。送信。EDRエージェントからEDR分析基盤。実行結果・時刻・状態を報告する。基盤はSOCへ結果を表示する。</desc>
<rect width="800" height="1532" fill="#f3f6fa"/>
<g font-family="Noto Sans CJK JP, Hiragino Kaku Gothic ProN, Meiryo, sans-serif">
<text x="32" y="34" font-size="16" font-weight="600" fill="#52657b">全体像  /  段階ごとに、上から読む</text>
<text x="32" y="74" font-size="28" font-weight="700" fill="#172e46">EDRテレメトリの収集・分析・対応</text>
<rect x="32" y="103" width="736" height="58" rx="12" fill="#e6eff8"/>
<text x="50" y="132" font-size="21" font-weight="600" fill="#172e46">観測データは基盤へ。対応指示は端末へ。</text>
<text x="32" y="189" font-size="15" font-weight="400" fill="#52657b">矢印：情報の受渡し　｜　内部・確認：通信なし　｜　並行：担当を分けて調整</text>
<rect x="72" y="215" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="244" font-size="20" font-weight="700" fill="#172e46">収集・分析</text>
