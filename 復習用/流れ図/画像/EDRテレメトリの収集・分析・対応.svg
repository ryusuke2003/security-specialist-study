<text x="30" y="916" font-size="19" font-weight="600" fill="#ffffff">5</text>
<rect x="88" y="899" width="306" height="40" rx="8" fill="#dcfce7"/>
<text x="102" y="924" font-size="19" font-weight="600" fill="#166534">EDR分析基盤</text>
<rect x="446" y="899" width="306" height="40" rx="8" fill="#ede9fe"/>
<text x="460" y="924" font-size="19" font-weight="600" fill="#5b21b6">EDRエージェント</text>
