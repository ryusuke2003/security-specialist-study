<rect x="446" y="556" width="306" height="40" rx="8" fill="#fef3c7"/>
<text x="460" y="581" font-size="19" font-weight="600" fill="#92400e">SOC担当者</text>
<path d="M402 576H435l-7 -6m7 6l-7 6" fill="none" stroke="#52657b" stroke-width="2"/>
<text x="94" y="624" font-size="22" font-weight="400" fill="#172e46">受信データを保存・分析し、不審な挙動と検知根拠を表示す</text>
<text x="94" y="656" font-size="22" font-weight="400" fill="#172e46">る。</text>
<rect x="72" y="708" width="696" height="47" rx="8" fill="#dfe8f1"/>
<text x="88" y="737" font-size="20" font-weight="700" fill="#172e46">対応指示</text>
