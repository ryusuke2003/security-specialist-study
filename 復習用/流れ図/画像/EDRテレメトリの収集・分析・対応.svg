<text x="94" y="1310" font-size="22" font-weight="400" fill="#172e46">実行結果・時刻・状態を報告する。基盤はSOCへ結果を表示す</text>
<text x="94" y="1342" font-size="22" font-weight="400" fill="#172e46">る。</text>
<rect x="32" y="1394" width="736" height="110" rx="12" fill="#fff1d7"/>
<text x="48" y="1421" font-size="17" font-weight="700" fill="#764a0b">前提・読み違えないポイント</text>
<text x="48" y="1451" font-size="19" font-weight="400" fill="#764a0b">基盤側で分析し、人が対応を承認する例。コマンド送信と隔離成功は</text>
<text x="48" y="1479" font-size="19" font-weight="400" fill="#764a0b">別。</text>
