name: Python tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          -s skills/security-specialist-trainer/tests
          -v

      - name: Export diagram review snapshot
        if: always()
        run: git archive --format=zip --output=diagram-review-source.zip HEAD

      - name: Upload diagram review snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagram-review-source
          path: diagram-review-source.zip
          retention-days: 1
